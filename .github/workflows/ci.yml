name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing useful and occupies a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Everything that needs no services. Fails fastest, so it goes first.
  # `typecheck` carries real weight: it is where the Zod↔Prisma enum assertions
  # live, and where `exactOptionalPropertyTypes` catches an `undefined` being
  # passed for an absent property.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo lint typecheck test build
      # Also inside `test`; named here so the gate RBAC.md §13 promises is
      # visible as its own step: the matrix, escalation negatives and route coverage.
      - name: Authorization suite
        run: pnpm test:authz

  # ───────────────────────────────────────────────────────────────────────────
  # The two-role database setup, created in CI exactly as it is locally.
  #
  # `db:doctor` is the assertion that matters: the application role must hold
  # neither BYPASSRLS nor CREATE, and ALTER DEFAULT PRIVILEGES must be in place
  # so that tables a future migration adds are readable. Each is a way the
  # isolation model fails silently, which is precisely why it is a gate.
  # ───────────────────────────────────────────────────────────────────────────
  database:
    name: Database roles and privileges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patchgrid
          TZ: UTC
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d patchgrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The service container starts bare; `db:bootstrap` does the rest, which
      # is the same path a developer with a pre-existing volume takes.
      DATABASE_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/patchgrid
      DATABASE_URL: postgresql://patchgrid_app:app@localhost:5432/patchgrid?schema=public
      DATABASE_MIGRATION_URL: postgresql://patchgrid_owner:owner@localhost:5432/patchgrid?schema=public
      PATCHGRID_OWNER_PASSWORD: owner
      PATCHGRID_APP_PASSWORD: app
      POSTGRES_DB: patchgrid
      POSTGRES_TEST_DB: patchgrid_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm db:bootstrap
      - run: pnpm db:generate
      - name: Assert the isolation invariants hold
        run: pnpm db:doctor

      # Re-running must be a no-op. The bootstrap is the recovery path for an
      # existing volume, so "safe to run twice" is a property, not a nicety.
      - name: Bootstrap is idempotent
        run: pnpm db:bootstrap && pnpm db:doctor

  # ───────────────────────────────────────────────────────────────────────────
  # The whole local stack, brought up the way a developer brings it up, with the
  # API booted against it. This is what proves the README's three commands work
  # on a machine that has never seen the project.
  # ───────────────────────────────────────────────────────────────────────────
  smoke:
    name: Stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup

      - name: Use the documented example environment
        run: cp .env.example .env

      # `--wait` treats an exited container as a failure, and `minio-init` is a
      # one-shot that exits 0 by design — so the long-running services are waited
      # on explicitly and the initialiser is run in the foreground after them.
      - name: Start infrastructure
        run: |
          docker compose up -d --wait postgres redis minio mailpit
          docker compose up minio-init

      - run: pnpm db:bootstrap
      - run: pnpm db:generate
      - run: pnpm db:doctor
      # The API ensures this and next month's audit partitions at boot, through
      # a function the migrations create (ADR-0034) — as any deploy would, it
      # boots against a migrated database.
      - run: pnpm --filter @patchgrid/database run migrate:deploy
      - run: pnpm --filter @patchgrid/api run build

      - name: Boot the API and assert readiness
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:4000/health > /dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- liveness ---"
          curl -fsS http://localhost:4000/health

          echo "--- readiness ---"
          body=$(curl -fsS http://localhost:4000/health/ready)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "readiness is not ok"; exit 1; }

          echo "--- openapi ---"
          curl -fsS http://localhost:4000/api/docs/openapi.json | grep -q '"openapi"' || { echo "no OpenAPI document"; exit 1; }

      - name: API log
        if: always()
        run: cat /tmp/api.log || true

      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ───────────────────────────────────────────────────────────────────────────
  # The browser suite (ENGINEERING.md §Testing, ADR-0011): on `main` only, so PR
  # feedback stays short. The whole stack, built as it ships — the API from
  # `dist`, the app from `next start` — against the seeded two-tenant database,
  # with Mailpit for the links the flows wait on. The negatives in
  # `apps/app/e2e/isolation.spec.ts` are the point: a session for one workspace
  # reaching nothing of another's, in a real browser.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: Browser suite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup

      - name: Use the documented example environment
        run: cp .env.example .env

      - name: Start infrastructure
        run: |
          docker compose up -d --wait postgres redis minio mailpit
          docker compose up minio-init

      - run: pnpm db:bootstrap
      - run: pnpm db:generate
      - run: pnpm --filter @patchgrid/database run migrate:deploy
      - run: pnpm db:seed
      - run: pnpm --filter @patchgrid/api run build
      - run: pnpm --filter @patchgrid/app run build
      - run: pnpm --filter @patchgrid/app exec playwright install --with-deps chromium

      # One runner, one address: the per-IP throttle would ration the whole
      # suite — and the Next server's own fetches — to 300 requests a minute.
      # Off here as it is for the integration specs; the throttles have their
      # own tests.
      # The suite addresses the stack by name; names a public zone resolves to
      # loopback today. Pinned in the hosts file so the run never depends on it.
      - name: Resolve the test hosts locally
        run: |
          echo "127.0.0.1 lvh.me api.lvh.me app.lvh.me admin.lvh.me acme.lvh.me globex.lvh.me" | sudo tee -a /etc/hosts
          grep -c lvh.me /etc/hosts

      - name: Boot the API and the app
        env:
          THROTTLE_ENABLED: "false"
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          (cd apps/app && pnpm start > /tmp/app.log 2>&1 &)
          for _ in $(seq 1 60); do
            if curl -fsS http://api.lvh.me:4000/health/ready > /dev/null 2>&1 && curl -fsS -o /dev/null http://app.lvh.me:3001/login; then break; fi
            sleep 2
          done
          curl -fsS http://api.lvh.me:4000/health/ready | grep -q '"status":"ok"'

      - name: Run the suite
        env:
          CI: "true"
        run: pnpm --filter @patchgrid/app test:e2e

      - name: Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/app/playwright-report
          retention-days: 7

      - name: API and app logs
        if: failure()
        run: |
          tail -200 /tmp/api.log || true
          tail -200 /tmp/app.log || true

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks scans history, not just the working tree: a secret that was
          # committed and then "removed" is still in the repository.
          fetch-depth: 0

      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --no-banner --verbose

      - uses: ./.github/actions/setup

      # Gated at `high`. The moderate findings that remain are transitive build
      # tooling; pnpm overrides in package.json carry the ones we can pin
      # forward, each with a note explaining why.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

  # ───────────────────────────────────────────────────────────────────────────
  # The physical schema, asserted from the catalogs of a freshly migrated
  # database (ADR-0023 §5). Its own job, so a failure names the actual problem.
  #
  # Every check here is a way tenant isolation fails SILENTLY: a table without a
  # policy, a single-column tenant FK (RI checks run with row security OFF), a
  # naive timestamp, a text id, a missing grant. None raises an error until it
  # is a breach. Also: the migrations must reproduce schema.prisma exactly, and
  # nothing may be dropped without saying why that is safe.
  # ───────────────────────────────────────────────────────────────────────────
  schema:
    name: Schema assertions and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patchgrid
          TZ: UTC
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d patchgrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The API's integration specs boot the real AppModule: the revocation
      # epoch and the tenant cache need a Redis to talk to.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/patchgrid
      DATABASE_URL: postgresql://patchgrid_app:app@localhost:5432/patchgrid?schema=public
      DATABASE_MIGRATION_URL: postgresql://patchgrid_owner:owner@localhost:5432/patchgrid?schema=public
      REDIS_URL: redis://localhost:6379
      DATABASE_SHADOW_URL: postgresql://patchgrid_owner:owner@localhost:5432/patchgrid_shadow?schema=public
      PATCHGRID_OWNER_PASSWORD: owner
      PATCHGRID_APP_PASSWORD: app
      POSTGRES_DB: patchgrid
      POSTGRES_TEST_DB: patchgrid_test
      POSTGRES_SHADOW_DB: patchgrid_shadow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm db:bootstrap
      - run: pnpm db:generate

      # Before touching a database: a destructive statement needs a `-- safe:`
      # annotation saying which earlier release stopped reading it.
      - name: Migration safety
        run: pnpm --filter @patchgrid/database run migrations:check

      # Applied as the owner, exactly as a deploy would.
      - name: Apply migrations
        run: pnpm --filter @patchgrid/database run migrate:deploy

      - name: Assert the physical schema
        run: pnpm test:schema

      # The tenant client extension (isolation layer 3) with RLS live underneath:
      # no context throws, a context sees only its org, a foreign orgId is
      # refused, and the tenant setting never outlives its transaction.
      - name: Tenant client against the live schema
        run: pnpm --filter @patchgrid/database run test:integration

      # The attachment specs PUT real bytes to a presigned URL and sniff them
      # back (ADR-0005), so object storage is the compose file's MinIO and its
      # bucket. A service container cannot be given MinIO's `server` command.
      - name: Start object storage
        run: |
          docker compose up -d --wait minio
          docker compose up minio-init

      # The API against the live schema: the request context and crossing
      # helpers over RLS, the platform repositories, and the whole session
      # lifecycle through the booted AppModule — every guard in production
      # order, rotation, reuse detection, the epoch — over HTTP.
      - name: API integration specs against the live schema
        run: pnpm --filter @patchgrid/api run test:integration

      # The isolation suite (ENGINEERING.md), a release gate: two lookalike
      # workspaces and a dual member through the booted app — every list, every
      # foreign id, tossed cookies, RLS under raw SQL, WITH CHECK, quotas per
      # org. The catalog assertions it also names ran above as test:schema.
      - name: Tenancy isolation suite
        run: pnpm --filter @patchgrid/api run test:tenancy

      # The migrations, replayed into the shadow database, must produce exactly
      # schema.prisma. A schema edit without its migration fails here.
      - name: Migrations match schema.prisma
        run: pnpm --filter @patchgrid/database run migrations:drift

