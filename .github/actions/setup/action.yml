name: Setup
description: Install pnpm, Node and dependencies, with the Turborepo cache restored.

runs:
  using: composite
  steps:
    # No version pinned here on purpose: pnpm/action-setup reads the
    # `packageManager` field, so the lockfile and CI can never disagree about
    # which pnpm produced them.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # --frozen-lockfile is the point of the whole step: a PR that changes a
    # dependency without committing the lockfile fails here rather than
    # resolving to something different from what anyone reviewed.
    - run: pnpm install --frozen-lockfile
      shell: bash

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-
