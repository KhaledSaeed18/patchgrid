version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Grouped, because twelve separate PRs for one framework's patch release is
    # how dependency updates stop being reviewed at all.
    groups:
      nestjs:
        patterns: ["@nestjs/*", "nestjs-*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      next:
        patterns:
          ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      testing:
        patterns:
          [
            "vitest",
            "@vitest/*",
            "unplugin-swc",
            "supertest",
            "@types/supertest",
          ]
      linting:
        patterns:
          [
            "eslint",
            "eslint-*",
            "@eslint/*",
            "@next/eslint-plugin-next",
            "typescript-eslint",
            "@typescript-eslint/*",
            "prettier",
            "prettier-*",
          ]
      types:
        patterns: ["@types/*"]
      # Everything the groups above don't claim, in one weekly PR. A package
      # joins the first group it matches, so this has to stay last.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned deliberately, not neglected: nestjs-zod peers @nestjs/common
      # ^10 || ^11 and does not support Nest 12 (docs/ARCHITECTURE.md §Stack).
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # Prisma's `latest` dist-tag currently points at an 8.0 release candidate;
      # the major moves when we decide it does (docs/ENGINEERING.md).
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      # Types track the runtime: we run Node 24 (.nvmrc, engines), and newer
      # majors describe APIs that do not exist there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react does not load under ESLint 10 yet
      # (`context.getFilename is not a function`); move when it does.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) compiler: a migration across every
      # package and its tooling, planned on its own, not a weekly bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # plugin-react 6 imports `vite/internal`, which only Vite 8 exports.
      # They move together.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # ioredis 6 speaks RESP3 by default and changes reconnect defaults; it
      # carries BullMQ, so it moves after a deliberate test against the queues.
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # The production images' base, pinned by digest.
  - package-ecosystem: docker
    directories: ["/apps/api", "/docker"]
    schedule:
      interval: weekly
      day: monday
    groups:
      images:
        patterns: ["*"]

  # The compose files' images, pinned by digest (M9 review). The `docker`
  # ecosystem reads Dockerfiles only; compose files are their own.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # A major here is a migration, not a bump: Tempo 3 and Grafana 13 change
      # the configuration and provisioning docker/observability carries, and
      # nothing in CI starts that profile to notice. Majors move by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
