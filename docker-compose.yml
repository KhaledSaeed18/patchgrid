# Local development infrastructure. The three apps run on the host via `pnpm dev`
# for fast HMR; only their dependencies live here (docs/ARCHITECTURE.md).
#
# Ports are env-overridable because another project's Postgres on 5432 is common
# and "port is already allocated" is an easy error to misread.

name: patchgrid

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      # The instance starts with no application database, as an RDS instance
      # does: `pnpm db:bootstrap` creates them, as the admin (ADR-0059).
      POSTGRES_DB: postgres
      PATCHGRID_ADMIN_PASSWORD: ${PATCHGRID_ADMIN_PASSWORD:-admin}
      # Everything is UTC on the wire and in the database (ADR-0023).
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs ONCE, against an empty volume only: the instance's admin, nothing
      # more. `pnpm db:bootstrap` does the rest, as that admin.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Chainguard's rebuild of MinIO from source. MinIO stopped publishing public
    # images: docker.io/minio/minio is gone ("pull access denied") and quay.io
    # now answers 401. The `-dev` variant carries the shell and `mc` the
    # healthcheck and the init script use. It runs as a non-root user, which is
    # why the volume was renamed: one created by the old root image is not
    # writable by it.
    image: cgr.dev/chainguard/minio:latest-dev@sha256:2cddf415c1f6eefc223204467cc49e9dabae494e4b23a1b4935e85f5347a8894
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-patchgrid}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-patchgrid-local-dev}
      # CORS is a SERVER setting in MinIO, not a per-bucket one: `mc cors set`
      # returns "functionality that is not implemented" against this build.
      # The browser PUTs directly to storage with a presigned URL (ADR-0005),
      # so the tenant origins have to be allowed here.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://*.lvh.me:3001,http://lvh.me:3000,http://*.localhost:3001,http://localhost:3001}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the bucket and set CORS so the browser can PUT directly to
  # storage with a presigned URL (ADR-0005). Exits 0 and stays exited.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:7e046421a370426ea57eec3f077653aa997f17c689145a48225c140ce7c7d5bd
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-patchgrid}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-patchgrid-local-dev}
      S3_BUCKET: ${S3_BUCKET:-patchgrid-attachments}
    volumes:
      - ./docker/minio:/opt/patchgrid/minio:ro
    entrypoint: ["/bin/sh", "/opt/patchgrid/minio/init.sh"]

  mailpit:
    image: axllent/mailpit:latest@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ─── Observability (ADR-0030) — `docker compose --profile observability up` ──
  # The API exports OTLP to the collector when OTEL_EXPORTER_OTLP_ENDPOINT is
  # set; the collector hands traces to Tempo and exposes metrics for
  # Prometheus; Grafana is provisioned with both and the tenant dashboard.
  # Off by default so the everyday stack stays light.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1-386
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_GRPC_PORT:-4317}:4317"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.10.9
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.6.16
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # 3000 is the marketing site on the host; Grafana answers on 3100.
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    depends_on:
      - prometheus
      - tempo

  # ─── DNS for the domain proof (ADR-0054) — `docker compose --profile dns up -d`
  # Answers for domains nobody can publish to, from the zone files in
  # docker/coredns/zones. Point the API at it with DNS_RESOLVERS=127.0.0.1:5354.
  coredns:
    image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
    profiles: ["dns"]
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./docker/coredns/Corefile:/etc/coredns/Corefile:ro
      - ./docker/coredns/zones:/zones:ro
    ports:
      - "${DNS_PORT:-5354}:53/udp"
      - "${DNS_PORT:-5354}:53/tcp"

  # ─── Single sign-on (ADR-0054) — `docker compose --profile sso up -d` ───────
  # A Keycloak with one realm, `acme`, imported at start: the identity provider
  # the seed points Acme's SSO connection at. Browser and API both reach it as
  # http://localhost:8180, so the issuer is the same string on both sides — the
  # API allows that private, plain-http issuer only because .env sets
  # SSO_ALLOW_PRIVATE_ISSUERS. Admin console: http://localhost:8180/admin.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    profiles: ["sso"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: patchgrid-demo
    volumes:
      - ./docker/keycloak/acme-realm.json:/opt/keycloak/data/import/acme-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8180"

  # Emulated AWS for the production rehearsal (ADR-0058): ECR, ECS, the ALB,
  # ACM, Route 53, RDS, ElastiCache, S3, SES, Secrets Manager, KMS, CloudWatch,
  # all on :4566, provisioned by OpenTofu from infra/. Pinned by digest to a
  # nightly: ALB TLS termination (floci#5959) shipped after 2.3.0. Move to the
  # first release that carries it.
  #
  # It starts real containers for tasks, databases and caches, so it holds the
  # Docker socket, which is root on this machine (THREAT-MODEL.md TB13). They
  # join this project's network, which is how tasks reach Mailpit and Keycloak
  # by name, and the task-role credentials proxy needs a user-defined network.
  #
  #   docker compose --profile aws up -d floci      # then: pnpm aws:up
  floci:
    image: floci/floci:nightly-10222026@sha256:ec21f4619d0ead9467d444b7d6cdd0ea95a9fd541313a0259a51fa6081d8c50f
    profiles: ["aws"]
    restart: unless-stopped
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      # HTTPS beside HTTP on :4566, chained to Floci's CA, which `pnpm aws:up`
      # exports. Its own extra listener on 443 is off: the ALB owns 80 and 443.
      FLOCI_TLS_ENABLED: "true"
      FLOCI_TLS_AWS_HTTPS_PORT: "0"
      QUARKUS_HTTP_HOST: 0.0.0.0
      FLOCI_SERVICES_DOCKER_NETWORK: patchgrid_default
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: patchgrid_default
      FLOCI_SERVICES_ECS_TASK_ROLE_CREDENTIALS_ENABLED: "true"
      # Database and cache endpoints by name, so TLS to them verifies.
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: floci
      # What SES accepts is relayed to Mailpit, as SMTP is in development.
      FLOCI_SERVICES_SES_SMTP_HOST: mailpit
      FLOCI_SERVICES_SES_SMTP_PORT: "1025"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    ports:
      - "${FLOCI_PORT:-4566}:4566"
      # The ALB's listeners.
      - "80:80"
      - "443:443"
      # RDS proxies, for tooling on this machine.
      - "7001-7010:7001-7010"

volumes:
  postgres-data:
  redis-data:
  object-data:
  tempo-data:
  prometheus-data:
  floci-data:
