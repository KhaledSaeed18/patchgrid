packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks postinstall scripts by default. Anything that genuinely needs one
# is listed here explicitly — see ENGINEERING.md §Repository hygiene.
allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  prisma: true
  "@prisma/engines": true
  msw: false
